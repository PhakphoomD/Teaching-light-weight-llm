# Simplified Teaching Loop Configuration
# =====================================
# Minimal, focused configuration for the simplified teaching system

# Student Configuration
# ---------------------
student:
  model: "llama-3.1-8b-instant"  # Groq Llama 3.1 8B (RPM=30, TPM=6K)
  provider: "groq"
  temperature: 0.0  # Deterministic for consistent testing
  max_tokens: 256  # Increased from 128 to avoid truncation (e.g., list items)
  timeout: 30
  # Backup: If rate limit breaks, switch to:
  #   provider: "local"
  #   model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  # Or use local Llama 3.1-8B-Instruct (better quality, slower):
  #   model: "meta-llama/Llama-3.1-8B-Instruct"

# Teacher Configuration
# ---------------------
teacher:
  model: "llama-3.3-70b-versatile"  # Groq Llama 3.3 70B (RPM=30, TPM=12K)
  provider: "groq"
  temperature: 0.2
  max_tokens: 256
  pass_threshold: 0.8  # Score threshold to pass (0-1)
  debug: false  # Set to true to enable debug prints (teacher scoring, feedback generation)
  
  # Hybrid Scoring: Blind Judge + Comparison Judge
  # Blind judge evaluates without seeing ground truth (unbiased)
  # Comparison judge evaluates with ground truth (accurate)
  hybrid_scoring:
    enabled: true
    blind_judge:
      model: "llama-3.1-8b-instant"  # Changed from Gemini (429 quota error)
      provider: "groq"
      weight: 0.2  # 20% weight - unbiased perspective
    comparison_judge:
      model: "llama-3.3-70b-versatile"  # Same as teacher
      provider: "groq"
      weight: 0.4  # 40% weight - accurate comparison
  
  # Metric weights (should sum to 1.0)
  # Total: blind(0.3) + comparison(0.3) + semantic(0.2) + rouge(0.1) + exact(0.1) = 1.0
  # Balanced: Blind judge (unbiased) = Comparison judge (accurate) for fair evaluation
  metrics:
    weights:
      blind_score: 0.3        # Blind judge (unbiased, no ground truth) - equal weight!
      comparison_score: 0.35   # Comparison judge (with ground truth) - equal weight!
      semantic_sim: 0.25       # Embedding similarity
      rouge_l: 0.10            # Longest common subsequence
      # exact_match: 0.05        # Perfect match bonus
  
  # Feedback generation config
  feedback:
    max_length: 250  # Max characters (increased for detailed format templates)
    use_cot: true    # Use Chain-of-Thought reasoning
    avoid_examples: false  # Teacher has full freedom

# Memory Configuration
# --------------------
memory:
  embedding_model: "all-MiniLM-L6-v2"
  similarity_threshold: 0.85  # Min similarity to retrieve (0-1) - Stricter for better quality
  top_k: 5  # Number of candidates to retrieve
  min_success_rate: 0.0  # Min success rate to use feedback (0.0 = use all feedback)
  
  # Storage paths
  storage_path: "logs/simplified/memory.jsonl"
  index_path: "logs/simplified/faiss.index"

# Loop Configuration
# ------------------
loop:
  max_rounds: 10  # Maximum refinement rounds
  enable_last_chance: false  # Disable last chance ground truth hint (set False for fair experiments)
  ground_truth_hint_round: 99  # Disabled - will be triggered by repetition detection instead
  
  # Early stopping config
  early_stopping:
    enabled: true
    patience: 5  # Stop after 5 rounds without improvement (increased from 3 for more chances)
    min_improvement: 0.02  # Minimum score gain required (lowered from 0.05 - small improvements count!)
    plateau_threshold: 0.9  # Stop if score >= this (good enough)
    start_from_round: 4  # Start checking from round 4 (give teacher more time)
  
  # Repetition detection (NEW)
  repetition_detection:
    enabled: true
    similarity_threshold: 0.98  # If similarity >= 0.98 (increased from 0.95 - must be nearly identical)
    consecutive_rounds: 3  # Check last 3 rounds (increased from 2 - need sustained repetition)
    trigger_ground_truth: false  # Disabled - no ground truth leak even on repetition  

# Logging Configuration
# ---------------------
logging:
  debug: true  # Enable debug output
  save_rounds: true  # Save round details to JSONL
  log_path: "logs/simplified"
  # Optional: set experiment-specific folders without editing code
  # experiment_root: "logs/experiments"   # Base directory for phases/runs
  # phase: "phase4_final_validation"      # Creates logs/experiments/<phase>/
  # run_name: "alpaca_mem_on"             # Subfolder inside the phase
  # (Environment overrides: EXPERIMENT_DIR, EXPERIMENT_PHASE, EXPERIMENT_NAME)

# Dataset Configuration (optional)
# --------------------------------
dataset:
  path: "data/alpaca_20.jsonl"
  num_questions: -1  # Number of questions to test (-1 for all)
