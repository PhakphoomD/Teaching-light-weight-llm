batch_size: 1
critic_type: hybrid
dataset: data/alpaca_20.jsonl
description: Custom experiment with tailored settings
disagreement_threshold: 0.3
early_stopping: true
embedding_dim: 384
embedding_model: all-MiniLM-L6-v2
epsilon_gain: 0.01
hard_negative_threshold: 2
k: 3
llm_reviewer:
  borderline_lower: 0.55
  borderline_upper: 0.75
  enabled: true
  max_tokens: 256
  model: same_as_teacher
  temperature: 0.1
  use_for_borderline: false
llm_weight: 0.6
log_dir: logs/experiments
max_retries: 3
max_rounds: 5
max_semantic_rules: 6
metrics:
  f1_weight: 0.5
  rouge_l_weight: 0.5
  rouge_l_word_threshold: 20
  use_f1: true
  use_rouge_l_for_long: true
name: custom
notes: Testing Phase 1-2 structure-first memory system with improved prompts
num_questions: 10
output_dir: experiments/results
patience: 2
retry_on_error: true
rule_distill_interval: 5
rule_min_quality: 0.7
rule_min_support: 2
rule_weight: 0.4
save_detailed_logs: true
save_memory: true
similarity_threshold: 0.5
strategy: adaptive
student_max_tokens: 128
student_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
student_temperature: 0.0
tau: 0.85
teacher_max_tokens: 256
teacher_model: gemini-2.5-flash
teacher_temperature: 0.1
timeout_seconds: 60
use_cot_student: false
use_cot_teacher: true
verbose: true
version: '3.0'
