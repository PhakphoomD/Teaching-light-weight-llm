name: "baseline"
description: "Baseline: single-pass answer, teacher evaluates; no retrieval, no refinement, no CoT"

# Dataset
dataset: "data/alpaca_20.jsonl"
num_questions: 10

# Student Model (local HF)
student_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
student_temperature: 0.7
student_max_tokens: 512

# Teacher Model (Gemini)
teacher_model: "gemini-2.0-flash-lite"
teacher_temperature: 0.3
teacher_max_tokens: 512

# Vector Retrieval (disabled for baseline)
embedding_model: "all-MiniLM-L6-v2"
embedding_dim: 384
k: 0
similarity_threshold: 0.0

# Chain-of-Thought
use_cot_teacher: false
use_cot_student: false

# Refinement
strategy: "simple"
max_rounds: 1
early_stopping: false

# Phase 2 (disable rule distillation)
rule_distill_interval: 0

# Critic (hybrid defaults apply; threshold adjustable)
disagreement_threshold: 0.5

# Runtime behavior
retry_on_error: true
max_retries: 2
verbose: false

