# Custom Experiment Configuration
# Template for experiments - adjust parameters before running

name: "custom"
description: "Custom experiment with tailored settings"

# Dataset
dataset: "data/alpaca_20.jsonl"
num_questions: 10

# Models
# student_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"  # Local model, no API quota issues
student_model: "gemini-2.0-flash-lite"  # Testing if quota reset
student_temperature: 0.0  # Deterministic output
student_max_tokens: 128   # Force brevity, prevent meta-commentary

teacher_model: "gemini-2.0-flash-lite"
teacher_temperature: 0.1  
teacher_max_tokens: 256   

# Critic Type
critic_type: "hybrid"  # HybridCritic (rule + LLM)

# Hybrid Critic Weights
rule_weight: 0.4
llm_weight: 0.6

# Metrics Configuration (F1 + ROUGE-L)
metrics:
  use_f1: true                    # Use F1 score for faithfulness
  use_rouge_l_for_long: true      # Use ROUGE-L for long answers
  rouge_l_word_threshold: 20      # Switch to ROUGE-L if answer > 20 words
  f1_weight: 0.5                  # Weight for F1 score
  rouge_l_weight: 0.5             # Weight for ROUGE-L score

# LLM Reviewer Configuration
llm_reviewer:
  enabled: true                  # DISABLED temporarily due to Gemini quota exhaustion
  model: "same_as_teacher"        # Use same model as teacher (gemini-2.5-flash)
  use_for_borderline: false       # Use LLM for ALL evaluations (not just borderline)
  borderline_lower: 0.55          # Not used when use_for_borderline=false
  borderline_upper: 0.75          # Not used when use_for_borderline=false
  temperature: 0.1                # Low temp for consistent feedback
  max_tokens: 256                 # Shorter, focused feedback

# Memory (Phase 1-2 structure-first)
embedding_model: "all-MiniLM-L6-v2"
embedding_dim: 384
k: 3
similarity_threshold: 0.5

# Chain-of-Thought
use_cot_teacher: true   # Enable CoT for better teacher reasoning
use_cot_student: false  # Disable for direct student answers

# Refinement
strategy: "adaptive"
max_rounds: 5
early_stopping: true

# Early Stopping
tau: 0.85
patience: 2
epsilon_gain: 0.01

# Phase 2 Parameters
hard_negative_threshold: 2
max_semantic_rules: 6
rule_min_quality: 0.7
rule_min_support: 2
rule_distill_interval: 5

# Disagreement Detection
disagreement_threshold: 0.3

# Output
output_dir: "experiments/results"
log_dir: "logs/experiments"
save_memory: true
save_detailed_logs: true

# Performance
batch_size: 1
timeout_seconds: 60
retry_on_error: true
max_retries: 3
verbose: true

# Metadata
version: "3.0"
notes: "Testing Phase 1-2 structure-first memory system with improved prompts"
