# experiments/rag-medquad-fair-tests/much-bigger-library.yml
# Comprehensive-corpus variant: 3B+RAG over the FULL 7-domain MedQuAD corpus
# (~10k records, held-out excluded + leak-scrubbed) instead of the Diabetes
# train-only 414. Tests whether a broader corpus (more chance of relevant
# same-disease content) changes RAG's verdict. Default retriever (no aspect
# rerank — that made it worse). Same judge/bar as every RAG arm.
#
#   $env:EXPERIMENT_PARAMS_SEED = "42"
#   run.py --config experiments/rag-medquad-fair-tests/much-bigger-library.yml `
#     --judge-fallback local:llama3.1:8b --runs-dir runs/rag-medquad-fair-tests

student:
  provider: local
  model: qwen2.5:3b

memory:
  type: rag
  corpus_path: indexes/medquad-all-topics
  top_k: 3
  similarity_threshold: 0.35

eval:
  judge:
    provider: groq
    model: llama-3.1-8b-instant
  pass_threshold: 1.0

params:
  arm: A
  max_rounds: 1
