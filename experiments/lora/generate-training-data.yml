# experiments/lora/generate-training-data.yml
#
# SUPERSEDED — kept for the record, not used by the shipped result. This recipe
# was written and then abandoned: a smoke run showed self-refine does
# not engage on the near-ceiling train split (5/5 passed at round 1), so there
# was no signal to distil. The LoRA adapter that was actually trained and
# evaluated (ADR-028, -0.292) used standard gold-SFT built by
# scripts/lora/build_data.py, which calls no model at all.
#
# LoRA data-generation recipe (NOT a measurement run). Uses the loop as the
# offline factory (ADR-024): arm B (self-refine) on the 3B over the Diabetes
# TRAIN split, to produce (question -> self-refined answer) pairs the 3B itself
# can reach, so LoRA can bake that self-refine style into 1-pass weights.
#
# Recipe chosen per the gate (ADR-027): self-refine, NOT RAG — RAG hurts
# (3B net-zero, 7B −7pt), while self-refine is the honest +9pt gain (ADR-024).
#
# Diffs from config/base.yml:
#   student : local qwen2.5:3b (the product floor we will LoRA-tune)
#   eval    : local llama3.1:8b judge (Llama != Qwen student, §0.2/V2; free, no
#             Groq cap — the quality gate that keeps only answers scoring >= 4),
#             pass_threshold 1.0 (score>=4 "correct AND complete")
#   params  : arm B (self-refine), max_rounds 3
# teacher unused (arm B never calls it); memory none (RAG excluded by the gate).
#
# Run on TRAIN only (§0.2 — never held-out); seed via EXPERIMENT_PARAMS_SEED:
#   $env:EXPERIMENT_PARAMS_SEED = "42"
#   & "...tlw python" run.py --config experiments/lora/generate-training-data.yml `
#     --data data/clean/Diabetes_and_Digestive_and_Kidney_Diseases_train.jsonl --runs-dir runs/lora-medquad

student:
  provider: local
  model: qwen2.5:3b

eval:
  judge:
    provider: local
    model: llama3.1:8b
  pass_threshold: 1.0

params:
  arm: B
  max_rounds: 3
