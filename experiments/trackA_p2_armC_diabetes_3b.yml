# experiments/trackA_p2_armC_diabetes_3b.yml
# HEADROOM EXPERIMENT arm C (blind teacher — the headline treatment). Diffs from
# base.yml: student=qwen2.5:3b, eval.pass_threshold=1.0 (score>=4). Teacher =
# Groq qwen/qwen3-32b (base default), sees NO ground truth in arm C. See arm-A
# file header for rationale.
#
# Run:
#   & "C:\Users\ham25\.conda\envs\tlw\python.exe" run.py --config experiments/trackA_p2_armC_diabetes_3b.yml \
#     --data data/clean/Diabetes_and_Digestive_and_Kidney_Diseases_train.jsonl --limit 15

student:
  provider: local
  model: qwen2.5:3b

eval:
  pass_threshold: 1.0

params:
  arm: C
  seed: 42
