# experiments/rag-medquad/large-model-with-rag.yml
# RAG ablation arm "7B+RAG" — does retrieval still help when the model is already
# stronger? (RAG_SPEC §3/§6, ADR-026). Secondary comparison: (7B+RAG) - 7B.
#
# Diffs from config/base.yml:
#   student : local qwen2.5:7b-instruct (base default; only retrieval differs from 7B)
#   memory  : type rag over indexes/medquad-diabetes-train, similarity_threshold 0.35,
#             top_k 3 — grounding into the first attempt, RAG-L3 guarded.
#   eval    : Groq llama-3.1-8b-instant + pass_threshold 1.0 (score>=4), SAME as all arms.
#   params  : arm A, max_rounds 1 (single pass).
#
#   $env:EXPERIMENT_PARAMS_SEED = "42"
#   & "C:\Users\ham25\.conda\envs\tlw\python.exe" run.py --config experiments/rag-medquad/large-model-with-rag.yml `
#     --judge-fallback local:llama3.1:8b

student:
  provider: local
  model: qwen2.5:7b-instruct

memory:
  type: rag
  corpus_path: indexes/medquad-diabetes-train
  top_k: 3
  similarity_threshold: 0.35

eval:
  judge:
    provider: groq
    model: llama-3.1-8b-instant
  pass_threshold: 1.0

params:
  arm: A
  max_rounds: 1
